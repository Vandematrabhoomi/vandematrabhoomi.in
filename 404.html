<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>वंदे मातृभूमि® — Vande Matrabhoomi®</title>
<!-- ═══════════════════════════════════════════════════════════════
     Article-link safety net.
     GitHub Pages serves this page for ANY path that has no file —
     including /a/<id>.html links that were shared right after
     publishing, before the GitHub Actions job has baked the static
     article page (the cron can lag by an hour or more when GitHub
     load-sheds schedules). Instead of a dead 404, this page fetches
     the story straight from the Live Desk backend and renders the
     article itself, photo included — so a shared link works within
     seconds of publishing. Once the real static page exists, this
     page is simply never served for that URL again (and the static
     page brings the story-specific link previews with it).
     ═══════════════════════════════════════════════════════════════ -->
<meta property="og:type" content="website">
<meta property="og:title" content="वंदे मातृभूमि® — Vande Matrabhoomi®">
<meta property="og:image" content="https://vandematrabhoomi.in/assets/vande-logo.png">
<meta property="og:site_name" content="Vande Matrabhoomi®">
<link rel="icon" href="/assets/vande-logo.png">
<style>
body{font-family:Georgia,"Noto Serif Devanagari",serif;max-width:720px;margin:0 auto;padding:24px;color:#1a0000;line-height:1.7;background:#fffdf9;}
.masthead{display:flex;align-items:center;gap:10px;margin-bottom:24px;border-bottom:3px solid #cc0000;padding-bottom:14px;}
.masthead img{height:40px;}
.masthead span{font-weight:700;font-size:20px;color:#cc0000;}
.cat{display:inline-block;background:#fff0f0;color:#cc0000;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:3px;margin-bottom:10px;}
h1{font-size:28px;margin:6px 0 8px;color:#1a0000;}
.hero{width:100%;border-radius:6px;margin-bottom:20px;}
p{margin:0 0 16px;font-size:17px;}
.back{display:inline-block;margin-top:28px;color:#cc0000;font-weight:600;text-decoration:none;}
.spin{margin:60px auto;width:34px;height:34px;border:4px solid #f3d9d9;border-top-color:#cc0000;border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.nf{text-align:center;margin-top:60px;}
.nf h1{font-size:22px;}
</style>
</head>
<body>
<div class="masthead"><img src="/assets/vande-logo.png" alt=""><span>वंदे मातृभूमि® — Vande Matrabhoomi®</span></div>
<div id="out"><div class="spin"></div></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbw_UDz41q9C-qnNwkZ5YUnmliSr08i1daJSvvaPi7aXnaH6TQMK-iTwwfQAfAtEZt52/exec';
  var out = document.getElementById('out');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function notFound() {
    document.title = 'पृष्ठ नहीं मिला — Vande Matrabhoomi®';
    out.innerHTML = '<div class="nf">'
      + '<h1>यह पृष्ठ नहीं मिला · This page could not be found</h1>'
      + '<p>हो सकता है यह लेख हटा दिया गया हो।<br>The article may have been removed.</p>'
      + '<a class="back" href="/">← वंदे मातृभूमि® मुखपृष्ठ पर जाएँ · Go to the Vande Matrabhoomi® homepage</a>'
      + '</div>';
  }

  function render(story, photo) {
    var lang = story.lang === 'en' ? 'en' : 'hi';
    document.documentElement.lang = lang;
    document.title = (story.hl || '') + ' — Vande Matrabhoomi®';
    var backLabel = lang === 'hi' ? '← वंदे मातृभूमि® पर और पढ़ें' : '← Read more on Vande Matrabhoomi®';
    var img = photo || story.mediaUrl || '';
    var html = '<div class="cat">' + esc(story.cat || '') + '</div>'
      + '<h1>' + esc(story.hl || '') + '</h1>'
      + (img ? '<img class="hero" src="' + esc(img) + '" alt="" onerror="this.remove();">' : '');
    String(story.body || story.sum || '').split(/\n\n+/).forEach(function (p) {
      p = p.trim();
      if (p) html += '<p>' + esc(p) + '</p>';
    });
    html += '<a class="back" href="/#opinion">' + esc(backLabel) + '</a>';
    out.innerHTML = html;
  }

  // Accept /a/<id>.html (the shared article links) and ?id=<id> (manual).
  var m = location.pathname.match(/^\/a\/([A-Za-z0-9_-]+)\.html?$/)
       || location.search.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if (!m) { notFound(); return; }
  var id = m[1];

  fetch(API + '?type=story')
    .then(function (r) { return r.json(); })
    .then(function (list) {
      var story = (list || []).filter(function (s) { return String(s.id) === String(id); })[0];
      if (!story) { notFound(); return; }
      if (story.mediaUrl) { render(story, ''); return; }
      // No baked photo yet — the image may still be sitting in the sheet
      // as base64 chunks waiting for the Actions job. Pull it directly so
      // the article shows its photo right away anyway.
      fetch(API + '?type=media')
        .then(function (r) { return r.json(); })
        .then(function (media) {
          var mine = (media || []).filter(function (x) { return String(x.id) === String(id); })[0];
          var photo = (mine && mine.chunks && mine.chunks.length)
            ? 'data:image/jpeg;base64,' + mine.chunks.join('') : '';
          render(story, photo);
        })
        .catch(function () { render(story, ''); });
    })
    .catch(function () {
      out.innerHTML = '<div class="nf"><h1>लेख लोड नहीं हो सका · The article could not be loaded</h1>'
        + '<p><a class="back" href="javascript:location.reload()">↻ पुनः प्रयास करें · Try again</a></p>'
        + '<a class="back" href="/">← मुखपृष्ठ · Homepage</a></div>';
    });
})();
</script>
</body>
</html>
